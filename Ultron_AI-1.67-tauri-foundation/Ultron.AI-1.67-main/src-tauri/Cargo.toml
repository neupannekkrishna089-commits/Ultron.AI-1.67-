[package]
name = "ultron"
version = "0.2.0"
description = "ULTRON — personal AI assistant for Windows (desktop foundation)"
edition = "2021"
rust-version = "1.77"

[lib]
# Needed so `tauri dev`/mobile targets can link against this crate as a lib;
# harmless and standard for Tauri v2 projects even though this phase is
# desktop-only.
name = "ultron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
# Optimize for a low-power CPU and small footprint rather than build speed:
# smaller binary, less to page in, and LTO trims dead code across crates.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
